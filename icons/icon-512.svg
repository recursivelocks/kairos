<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f0728" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring (Clock & Compass) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#312e81" stroke-width="8" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="12 16" />

  <!-- Navigation GPS Path -->
  <path d="M 160 360 C 160 280, 352 280, 352 200 C 352 160, 290 120, 256 120" 
        fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

  <!-- Compass / GPS Pin shaped as Clock Hands -->
  <g transform="translate(256, 120)" filter="url(#glow)">
    <!-- Pin Outer Glow -->
    <path d="M 0 -24 C -14 -24, -24 -14, -24 0 C -24 20, 0 44, 0 44 C 0 44, 24 20, 24 0 C 24 -14, 14 -24, 0 -24 Z" 
          fill="url(#glowGrad)" />
    <!-- Pin Center -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- Navigation Target glow -->
  <circle cx="160" cy="360" r="12" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="160" cy="360" r="6" fill="#ffffff" />
</svg>
